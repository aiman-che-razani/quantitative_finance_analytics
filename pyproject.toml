[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "axiom-research"
version = "0.1.0"
description = "Reproducible quantitative research, beginning with daily data and a tested backtest"
requires-python = ">=3.12"
dependencies = ["polars>=1.30,<2", "numpy>=2.2,<3", "pydantic>=2.10,<3", "exchange-calendars>=4.11,<5"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.65,<2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[project.scripts]
axiom = "axiom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["axiom"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
