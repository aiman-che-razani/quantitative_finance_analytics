name: Axiom validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the development/native version; 3.14 is what the Docker image ships.
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: axiom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axiom"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://axiom:test-password@localhost:5432/axiom
      AXIOM_TEST_DATABASE_URL: postgresql+psycopg://axiom:test-password@localhost:5432/axiom
      API_TOKEN: ci-test-token-01234567890123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev --extra yahoo
      - run: uv run alembic upgrade head
      - run: uv run ruff check axiom tests scripts alembic
      - run: uv run ruff format --check axiom tests scripts alembic
      - run: uv run mypy axiom scripts
      - run: uv run python scripts/build_native.py
      - run: uv run pytest -q
  windows:
    # Development happens on Windows; e7f2085 fixed a Windows-only snapshot bug CI missed.
    # No PostgreSQL service here, so database tests skip and the rest run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.15"
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q -rs
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26" # match apps/dashboard/Dockerfile
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate ephemeral Compose secrets
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "API_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
      - run: docker compose up --build -d
      - name: Wait for the API to report healthy
        run: |
          for _ in $(seq 1 60); do
            if curl -sf -H "Authorization: Bearer $API_TOKEN" http://127.0.0.1:8820/health; then
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy" >&2
          docker compose logs
          exit 1
      - run: docker compose exec -T api python scripts/demo_platform.py
      - name: Wait for the dashboard to respond
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8821/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Dashboard never responded" >&2
          docker compose logs
          exit 1
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
